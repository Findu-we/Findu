<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findu - Platform Literasi Keuangan & Investasi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Authentication Modal -->
    <div id="authModal" class="auth-modal">
        <div class="auth-container">
            <div class="auth-card login-card" id="loginCard">
                <div class="auth-header">
                    <h2>Login</h2>
                    <p>Selamat datang kembali di Findu</p>
                </div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="nama@email.com" required>
                        <span class="input-icon">✉️</span>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <span class="input-icon">🔒</span>
                    </div>
                    <div class="form-remember">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Ingat saya</label>
                    </div>
                    <button type="submit" class="btn-auth">Masuk</button>
                </form>
                <div class="auth-footer">
                    <p>Belum punya akun? <a href="#" onclick="toggleAuth()">Daftar di sini</a></p>
                    <a href="#" class="forgot-password">Lupa password?</a>
                </div>
            </div>

            <div class="auth-card register-card hidden" id="registerCard">
                <div class="auth-header">
                    <h2>Daftar</h2>
                    <p>Mulai perjalanan finansial Anda sekarang</p>
                </div>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-name">Nama Lengkap</label>
                        <input type="text" id="register-name" placeholder="Nama Anda" required>
                        <span class="input-icon">👤</span>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" placeholder="nama@email.com" required>
                        <span class="input-icon">✉️</span>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" placeholder="Minimal 8 karakter" required>
                        <span class="input-icon">🔒</span>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm">Konfirmasi Password</label>
                        <input type="password" id="register-confirm" placeholder="Ulangi password" required>
                        <span class="input-icon">🔒</span>
                    </div>
                    <div class="form-checkbox">
                        <input type="checkbox" id="agree-terms" required>
                        <label for="agree-terms">Saya setuju dengan <a href="#">syarat & ketentuan</a></label>
                    </div>
                    <button type="submit" class="btn-auth">Daftar</button>
                </form>
                <div class="auth-footer">
                    <p>Sudah punya akun? <a href="#" onclick="toggleAuth()">Login di sini</a></p>
                </div>
            </div>
        </div>
    </div>


    <footer>
        <div class="container">
            <p>&copy; 2026 Findu - Platform Literasi Keuangan. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
